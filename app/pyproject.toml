[project]
name = "forest"
version = "0.1.0"
description = "Acoustic monitoring and bird species classification in Nepal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "earthengine-api>=1.4.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.44.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

